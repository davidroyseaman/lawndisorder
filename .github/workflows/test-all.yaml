name: test-all

# concurrency:
#   group: deployment # ${{ github.head_ref }}
#   cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      run-on-all:
        description: "Skip the dorny/paths-filter step and just run on everything"
        required: true
        default: "true"

  pull_request:

env:
  DOCKER_REGISTRY_URL_PREFIX: ghcr.io/${{ github.repository_owner }}
  KUBECONFIG: kube_config.yaml
  DOMAIN: ctrlfrk.com
jobs:
  # status:
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false # dsx change this maybe
  #     # matrix:
  #     #   folder: [websocket-server, server, stream-monitor, client, shaders, puzzle, tunnel-dev, chasewheel]
  #     #   # folder: [server, client]
  #   steps:
  #     - uses: actions/checkout@v3
  #     - uses: mikefarah/yq@master

  #     - name: Attempt to set status
  #       run: |
  #         curl \
  #           -X POST \
  #           -H "Accept: application/vnd.github+json" \
  #           -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
  #           https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
  #           -d '{"state":"success","target_url":"https://example.com/build/status","description":"The build succeeded!","context":"what-is/this"}'

  changes: # from https://github.com/dorny/paths-filter#examples
    runs-on: ubuntu-latest
    # Required permissions (apparently not?)
    # permissions:
    #   pull-requests: read
    outputs:
      # Expose matched filters as job 'packages' output variable
      changed_projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v3
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: .github/filters.yaml

  tests:
    runs-on: ubuntu-latest
    needs: changes
    # permissions: write-all # dsx was hoping this would let status work
    if: ${{ !(needs.changes.outputs.changed_projects == '[]') }}
    strategy:
      fail-fast: false # dsx change this maybe
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.changed_projects) }}
        # folder: [websocket-server, stream-monitor, serf/server, serf/client, shaders, puzzle, tunnel-dev, chasewheel, village/client, village/game-server, village/twitch-server, empty/client, empty/server, 3d/client, 3d/server]
        # folder: [server, client]

    steps:
      - uses: actions/checkout@v3
      - uses: mikefarah/yq@master

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Store kubeconfig for kubectl login
        working-directory: ${{ matrix.folder }}
        run: 'echo "$KUBE_CONFIG" > kube_config.yaml'
        shell: bash
        env:
          KUBE_CONFIG: ${{secrets.KUBE_CONFIG}}

      # - name: Create k8s imagePullSecrets
      #   working-directory: ${{ matrix.folder }}
      #   run: |
      #     kubectl create secret docker-registry ghcr-docker \
      #       --docker-server=ghcr.io \
      #       --docker-username=${{ github.actor }} \
      #       --docker-password=${{ secrets.READ_PACKAGES_PAT }} \
      #       --docker-email=anything@something.com \
      #       --dry-run=client -o yaml \
      #     | kubectl apply -f -

      - name: Test step
        working-directory: ${{ matrix.folder }}
        run: |
          echo ${{ matrix.folder }}: Test
          if [ -f "./test" ]; then
            ./test
          fi

      # - name: Deploy step
      #   working-directory: ${{ matrix.folder }}
      #   run: |
      #     echo ${{ matrix.folder }}: Deploy
      #     if [ -f "./deploy" ]; then
      #       ./deploy
      #     fi

      - name: Attempt to set label
        # if: ${{ failure() }}
        # error, failure, pending, success
        run: |
          curl \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/labels \
            -d '{"labels": ["tested"]}'

      - name: Attempt to set failure status
        if: ${{ failure() }}
        # error, failure, pending, success
        run: |
          curl \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"failure","target_url":"https://example.com/build/status","description":"The build failed!","context":"oh-on/i-cant-believe-youve-done-this"}'
